<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Accenture Visitor ID Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
padding:20px;
}

.container{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.form{
width:300px;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.form input{
width:100%;
padding:10px;
margin:8px 0;
}

.card{
width:900px;
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.header{
padding:20px;
font-size:60px;
font-weight:bold;
}

.header span{
color:#8a00ff;
}

.content{
display:flex;
padding:20px;
}

.photo{
width:220px;
height:280px;
border:4px solid #8a00ff;
border-radius:20px;
overflow:hidden;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.details{
flex:1;
padding-left:25px;
}

.visitor{
font-size:60px;
font-weight:bold;
color:#6a00ff;
}

.pass{
font-size:28px;
letter-spacing:10px;
}

.info{
margin-top:15px;
}

.info label{
display:block;
color:#666;
font-size:18px;
}

.info div{
font-size:30px;
font-weight:bold;
}

#qrcode{
padding:10px;
background:white;
border:4px solid #8a00ff;
border-radius:15px;
}

.footer{
background:#4d008c;
color:white;
display:flex;
justify-content:space-around;
padding:20px;
font-size:22px;
font-weight:bold;
}

button{
padding:12px 20px;
border:none;
background:#8a00ff;
color:white;
cursor:pointer;
margin-top:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="form">
<h2>Visitor Details</h2>

<input id="name" placeholder="Name" value="Tabrez">
<input id="mobile" placeholder="Mobile" value="9876543210">
<input id="company" placeholder="Company" value="JCI">
<input id="visitorid" placeholder="ID" value="ABC123">
<input id="valid" placeholder="Valid Upto" value="12 PM Today">

<input type="file" id="photo">

<button onclick="updateCard()">Generate</button>
<button onclick="downloadCard()">Download PNG</button>

</div>

<div id="card" class="card">

<div class="header">
accenture<span>></span>
</div>

<div class="content">

<div class="photo">
<img id="preview"
src="https://via.placeholder.com/220x280">
</div>

<div class="details">

<div class="visitor">VISITOR</div>
<div class="pass">PASS</div>

<div class="info">
<label>NAME</label>
<div id="vname">Tabrez</div>
</div>

<div class="info">
<label>MOBILE</label>
<div id="vmobile">9876543210</div>
</div>

<div class="info">
<label>COMPANY</label>
<div id="vcompany">JCI</div>
</div>

</div>

<div id="qrcode"></div>

</div>

<div class="footer">
<div id="vvalid">12 PM Today</div>
<div id="vid">ABC123</div>
</div>

</div>

</div>

<script>

let qr;

function updateCard(){

let name=document.getElementById('name').value;
let mobile=document.getElementById('mobile').value;
let company=document.getElementById('company').value;
let id=document.getElementById('visitorid').value;
let valid=document.getElementById('valid').value;

document.getElementById('vname').innerText=name;
document.getElementById('vmobile').innerText=mobile;
document.getElementById('vcompany').innerText=company;
document.getElementById('vid').innerText='ID : '+id;
document.getElementById('vvalid').innerText='VALID : '+valid;

document.getElementById('qrcode').innerHTML='';

new QRCode(document.getElementById("qrcode"),{
text:`${name} | ${mobile} | ${company} | ${id}`,
width:180,
height:180
});
}

document.getElementById('photo').addEventListener('change',function(e){

const reader=new FileReader();

reader.onload=function(){
document.getElementById('preview').src=reader.result;
}

reader.readAsDataURL(e.target.files[0]);

});

function downloadCard(){

html2canvas(document.getElementById('card')).then(canvas=>{

let link=document.createElement('a');
link.download='Visitor_ID.png';
link.href=canvas.toDataURL();
link.click();

});

}

updateCard();

</script>

</body>
</html>
