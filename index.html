<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accenture Visitor ID</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
    background:#f0f2f5;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px;
}

.card{
    width:900px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.header{
    background:#ffffff;
    padding:20px 30px;
}

.logo{
    font-size:70px;
    font-weight:bold;
    color:black;
}

.logo span{
    color:#a100ff;
}

.main{
    display:flex;
    padding:20px;
}

.photo{
    width:220px;
    height:280px;
    border:4px solid #7b00ff;
    border-radius:20px;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.details{
    flex:1;
    padding-left:30px;
}

.visitor{
    color:#5e00d6;
    font-size:60px;
    font-weight:bold;
}

.pass{
    letter-spacing:10px;
    font-size:28px;
}

.info{
    margin-top:20px;
}

.info h3{
    color:#666;
    margin-bottom:5px;
}

.info p{
    font-size:22px;
    font-weight:bold;
    margin-top:0;
}

.qr{
    width:220px;
    text-align:center;
}

.qr img{
    width:200px;
    border:5px solid #7b00ff;
    border-radius:15px;
}

.footer{
    background:#4b0082;
    color:white;
    display:flex;
    justify-content:space-around;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    background:#7b00ff;
    color:white;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card" id="idcard">

<div class="header">
<div class="logo">accenture<span>></span></div>
</div>

<div class="main">

<div class="photo">
<img src="https://via.placeholder.com/220x280.png?text=PHOTO">
</div>

<div class="details">

<div class="visitor">VISITOR</div>
<div class="pass">PASS</div>

<div class="info">
<h3>NAME</h3>
<p>TABREZ</p>
</div>

<div class="info">
<h3>MOBILE</h3>
<p>9876543210</p>
</div>

<div class="info">
<h3>COMPANY</h3>
<p>JCI</p>
</div>

</div>

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=ABC123">
</div>

</div>

<div class="footer">
<div>VALID UPTO : 12 PM TODAY</div>
<div>ID : ABC123</div>
</div>

</div>

<button onclick="downloadCard()">Download ID Card</button>

<script>
function downloadCard() {
    html2canvas(document.getElementById("idcard")).then(canvas => {
        let link = document.createElement("a");
        link.download = "Accenture_Visitor_ID.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
